# ---------------------------------------------------------------------------
# Build settings for the Foliage mod. Everything that is likely to change
# between versions lives here, so build.gradle itself rarely needs editing.
# ---------------------------------------------------------------------------

# Gradle itself: memory for the build and a few speed-ups.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft and NeoForge. The modpack this mod was written for pins NeoForge
# 21.1.267, so we build against exactly that version.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.267
neo_version_range=[21.1.200,)
loader_version_range=[4,)

# Parchment adds readable parameter names and javadoc to the decompiled
# Minecraft source. It only affects development, not the built jar.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Dynamic Trees, the mod whose leaves Foliage reshapes. Its jar is in the libs
# folder as dynamictrees-<dynamictrees_version>.jar. The range is what Foliage
# asks for when the game starts: the addon doors it uses are the same from
# 1.7.2 on, and a 1.8 may move them.
dynamictrees_version=1.7.2
dynamictrees_version_range=[1.7.2,1.8)

# Calendar gives the date. Its jar is in libs as calendar-<calendar_version>.jar.
calendar_version=0.2.0
calendar_version_range=[0.2.0,)

# Distant Horizons, which draws far land. Only its API is needed, and only to
# compile against: libs/distanthorizons-api-<distant_horizons_version>.jar holds
# the api and coreapi packages of the mod jar of that version. Foliage asks for
# nothing at runtime; it looks whether the mod is there.
distant_horizons_version=3.3.3

# Seasons gives the leaf colors and says where there is a winter. Its jar is
# in libs as seasons-<seasons_version>.jar.
seasons_version=0.4.0
seasons_version_range=[0.4.0,)

# The mod itself.
mod_id=foliage
mod_name=Foliage
mod_license=MIT
mod_version=0.5.0
mod_group_id=io.github.superveryfastcar.foliage
mod_authors=coolcritter22
mod_description=Leaves with depth for Dynamic Trees: crowns built from leaf shells, cards and small clumps instead of plain cubes, that thin out in autumn, stand bare with twigs in winter and bud in spring. A bare tree lets light, snow and players through. An addon for Dynamic Trees, made to work with Calendar and Seasons.
